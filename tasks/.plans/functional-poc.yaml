api_version: taskspec.dev/v1
kind: TaskPlan
approved: true
metadata:
  name: ensemble-functional-poc
  source: docs/ensemble/experiment-plan.md
units:
  - id: T-20261106-poc-boundaries
    title: Constrain generated artifacts and isolate fixed verifiers
    effort: M
    profile: standard
    agent: codex
    execution_backend: codex
    depends_on: []
    touches_paths: []
    creates_paths:
      - ensemble_poc/__init__.py
      - ensemble_poc/contracts.py
      - ensemble_poc/containment.py
      - poc_tests/test_boundaries.py
    source_note: Owner approved the functional POC plan and explicitly requested implementation.
    why: Demonstrate a bounded MCP to Ensemble to native subscription to independently verified 2048 path.
    goal: Constrain generated artifacts and isolate fixed verifiers.
    context: Local experimental POC only. Native models produce data without tools. Preserve upstream runtime. No public deployment or real tenant data. PostgreSQL for persistence.
    behaviors:
      - id: B-1
        given: a valid scoped input
        when: the component processes it
        then: the bounded positive path returns verifiable artifacts and explicit state
      - id: B-2
        given: a hostile input or unavailable required capability
        when: the component processes it
        then: it fails closed without granting authority or launching duplicate execution
    evals:
      - id: eval_1
        description: Discriminating positive and negative component tests.
        command: python3 -m unittest poc_tests.test_boundaries -v
        verifies:
          - B-1
          - B-2
        terminal: true
        expected_duration_sec: 60
    anti_patterns:
      - Do not claim native success from simulation.
      - Do not give models signing keys, shell tools or acceptance authority.
    do_not_touch:
      - metagpt/
      - tests/
      - config/
      - requirements.txt
      - setup.py
      - LICENSE
      - .github/
