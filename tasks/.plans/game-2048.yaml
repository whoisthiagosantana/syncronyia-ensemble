api_version: taskspec.dev/v1
kind: TaskPlan
approved: true
metadata:
  name: ensemble-game-2048
  source: experiments/poc/README.md
units:
  - id: T-20261106-game-2048
    title: Generate and independently verify the fixed 2048 game through Ensemble
    effort: M
    profile: standard
    agent: codex
    execution_backend: codex
    depends_on: []
    touches_paths: []
    creates_paths:
      - examples/ensemble-2048/index.html
      - examples/ensemble-2048/style.css
      - examples/ensemble-2048/game.mjs
      - examples/ensemble-2048/ui.mjs
    source_note: Owner approved the functional POC plan and explicitly requested implementation.
    why: Demonstrate a bounded MCP to Ensemble to native subscription to independently verified 2048 path.
    goal: Deliver the fixed four-file static 2048 game through the MCP pipeline without manual game edits.
    context: The owner explicitly approved the 2048 Ensemble POC. Claude planning is advisory; native Codex returns JSON files only. The external coordinator integrates and accepts the exact tested bytes. No shell tools, credentials, persistence, packages or public deployment in the game.
    behaviors:
      - id: B-1
        given: a valid scoped input
        when: the component processes it
        then: the bounded positive path returns verifiable artifacts and explicit state
      - id: B-2
        given: a hostile input or unavailable required capability
        when: the component processes it
        then: it fails closed without granting authority or launching duplicate execution
    evals:
      - id: eval_1
        description: Run the fixed isolated logic and browser acceptance harness against the integrated game.
        command: python3 -c "import json, pathlib; from ensemble_poc.verifier import verify; c=json.loads(pathlib.Path('.local/poc/config.json').read_text()); r=verify(pathlib.Path('examples/ensemble-2048'),pathlib.Path.cwd(),c); print(json.dumps(r)); assert r['passed']"
        verifies:
          - B-1
          - B-2
        terminal: true
        expected_duration_sec: 60
    anti_patterns:
      - Do not claim native success from simulation.
      - Do not give models signing keys, shell tools or acceptance authority.
    do_not_touch:
      - ensemble_poc/
      - experiments/poc/acceptance/
      - metagpt/
      - tests/
      - config/
      - requirements.txt
      - setup.py
      - LICENSE
      - .github/
